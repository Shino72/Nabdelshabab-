# تشغيل الموقع على خادم VPS مع قاعدة PostgreSQL محلية وشهادة HTTPS تلقائية عبر Caddy.
# قبل التشغيل: انسخ .env.example إلى .env وعدّل القيم (ومنها POSTGRES_PASSWORD: حروف وأرقام فقط)، وعدّل الدومين في deploy/Caddyfile.
# لاستخدام Supabase بدل القاعدة المحلية: اضبط DATABASE_URL في .env واحذف خدمة db.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://nabd:${POSTGRES_PASSWORD}@db:5432/nabd?sslmode=disable}
      UPLOADS_DIR: /uploads
      TRUST_PROXY: "true"
    volumes:
      - news_uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nabd
      POSTGRES_DB: nabd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?اضبط POSTGRES_PASSWORD في .env}
    volumes:
      - news_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabd -d nabd"]
      interval: 5s
      timeout: 5s
      retries: 10
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  news_db:
  news_uploads:
  caddy_data:
  caddy_config:
